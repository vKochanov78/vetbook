# ============================================================
#  VetBook - настройки
#
#  Този файл е вътре в програмата и е еднакъв за всички.
#  Ако до стартирания .jar сложиш файл със същото име, стойностите
#  в него са по-силни. Така всеки може да си смени таксата или пътя
#  до базата, без да пипа кода.
# ============================================================

# --- База от данни ---
# Път до файла на базата, спрямо папката, от която се стартира.
db.path=data/vetbook.db

# --- Такси и лимити ---
# Такса за консултация в евро.
# Не се начислява на животни с валиден златен картон.
visit.consultationFee=15.00

# Максимален брой прегледи на един лекар за един ден.
visit.maxPerDoctorPerDay=8

# Колко минути заема един преглед. Ползва се, за да се провери
# дали два прегледа на един лекар не се застъпват по час.
visit.durationMinutes=30

# --- Главен прозорец ---
ui.window.title=VetBook - регистър на прегледите
ui.window.width=1200
ui.window.height=760
