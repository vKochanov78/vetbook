# ============================================================
#  VetBook — настройки по подразбиране
#
#  Този файл е вътре в приложението и е еднакъв за всички.
#  Ако до стартирания .jar сложиш файл със същото име "vetbook.properties",
#  стойностите в него надделяват — така всеки може да си промени
#  таксата или пътя до базата, без да пипа кода.
# ============================================================

# --- База от данни ---
# Път до файла на SQLite базата, спрямо папката, от която се стартира.
db.path=data/vetbook.db

# --- Такси и лимити (т. 5 от заданието) ---
# Такса за консултация в евро. Не се начислява на животни с валиден златен картон.
visit.consultationFee=15.00

# Максимален брой прегледи на един лекар за един ден.
visit.maxPerDoctorPerDay=8

# Колко минути заема един преглед. Ползва се, за да се провери
# дали два прегледа на един лекар се застъпват по час.
visit.durationMinutes=30

# --- Главен прозорец ---
ui.window.title=VetBook — регистър на прегледите
ui.window.width=1200
ui.window.height=760
